<!-- Descrição: Template Thymeleaf que lista todos os alunos cadastrados em uma tabela HTML. -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <style>
        body  { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1    { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th    { background-color: #4a90d9; color: white; padding: 10px; text-align: left; }
        td    { padding: 10px; border-bottom: 1px solid #ddd; }
        tr:hover td { background-color: #f5f5f5; }
        .empty { color: #888; font-style: italic; }
        a     { display: inline-block; margin-top: 20px; color: #4a90d9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Alunos Cadastrados</h1>

    <table th:if="${not #lists.isEmpty(alunos)}">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Matrícula</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nome}">Nome do Aluno</td>
                <td th:text="${aluno.matricula}">Matrícula</td>
            </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${#lists.isEmpty(alunos)}">Nenhum aluno cadastrado ainda.</p>

    <a href="/alunos">Cadastrar novo aluno</a>
</body>
</html>

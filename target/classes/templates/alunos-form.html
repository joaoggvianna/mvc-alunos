<!-- Descrição: Template Thymeleaf que exibe o formulário de cadastro de alunos (nome e matrícula). -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1   { color: #333; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 16px; padding: 10px 24px; background-color: #4a90d9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #357abd; }
    </style>
</head>
<body>
    <h1>Cadastro de Aluno</h1>
    <form action="/alunos" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Nome completo do aluno" required>

        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" name="matricula" placeholder="Número de matrícula">

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
